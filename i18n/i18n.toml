# Features

[govTransp]
  en="Governance Transparency"
  fr="Gouvernance Transparente"
[govTranspAbout]
  en="Keep anyone to the same page. Engage your peers by sharing the structure of your organisation, the purposes of your circles and the mandates of your roles. Roles comes with authority rules that allows giving responsabilities and trust to members and autonomy in the governance of circles."
  fr="Faites en sorte que tout le monde soit sur la même longueur d’onde. Engagez vos pairs en partageant la structure de votre organisation, les objectifs de vos cercles et les mandats de vos rôles. Les rôles sont accompagnés de règles d’autorité qui permettent de donner des responsabilités et de la confiance aux membres et de l’autonomie dans la gouvernances des cercles."

[govFeat1]
  en="Dynamic Organigram"
  fr="Organigramme dynamique"
[govFeat2]
  en="Roles and Circles"
  fr="Rôles et Cercles"
[govFeat3]
  en="Distributed Authority"
  fr="Authorité Distribuée"
[govFeat4]
  en="Controlled Visibility"
  fr="Contrôle de la Visibilité"
[govFeat5]
  en="Mandates and Contracts (mutual validation)"
  fr="Mandats et Contrats (validation mutuelle)"
[govFeat6]
  en="Intuitive Navigation"
  fr="Navigation Intuitive"
[govFeat7]
  en="History Journal"
  fr="Historique"

[asyncCom]
  en="Asynchronous Communication"
  fr="Communication Asynchrone"
[asyncComAbout]
  en="Twitter use tweets, Gmail use e-mails, Fractale use tensions. A tension is a general communication object that is akin to an email and can be sent to any circle in Fractale. Tensions comes with general categories to distinguish the type of problem to deal with, **Operational**, **Governance**, **Help** or **Alert**, along with user-defined labels to help you organize your data. The recipients of the notifications are naturally determined by the members of the targeted circle and the type of tension. Tensions can be searched and filtered based directly on the structure of the organisation."
  fr="Twitter utilise des tweets, Gmail utilise des e-mails, Fractale utilise des tensions. Une tension est un objet de communication général qui s’apparente à un e-mail et qui peut être envoyé à n’importe quel cercle dans Fractale. Les tensions sont fournies avec des catégories générales pour distinguer le type de problème à traiter, **Opérationnel**, **Gouvernance**, **Aide** ou **Alerte**, ainsi que des étiquettes définies par l’utilisateur pour vous aider à organiser vos données. Les destinataires des notifications sont naturellement déterminés par les membres du cercle ciblé et le type de tension. Les tensions peuvent être recherchées et filtrées en se basant directement sur la structure de l’organisation."

[asyncFeat1]
  en="Tensions Driven Communication"
  fr="Tensions Driven Communication"
[asyncFeat2]
  en="Discussion Threads"
  fr="Fils de Discussion"
[asyncFeat3]
  en="Markdown Support"
  fr="Markdown Support"
[asyncFeat4]
  en="Email Notifications, per tension subscriptions"
  fr="Notifications E-mail, abonnements par tension"
[asyncFeat5]
  en="Labels"
  fr="Etiquettes"
[asyncFeat6]
  en="Project Management"
  fr="Management de Projet"
[asyncFeat7]
  en="Full-Text Search and Filtering"
  fr="Recherche Fulltext et Filtrage"


# Roadmap

[roadmapX]
  en="""
  * Manage tensions in Project boards, **Kanban** style.
  * Events and **Shared Calendars**.
  * **Mailing lists** linked to circles (create tension an notify bunch of peer directly by sending email).
  * **Voting system** for Roles election (sortition, majority judgment, etc).
  * **Find** peers and recruit collaborators across Fractale by publishing open roles.
  * GraphQL API.
  * Data importers.
  * Mobile app.
  """
  fr="""
  * Gérer les tensions dans les tableaux de projet, à la **Kanban**.
  * Événements et **Calendriers Partagés**.
  * **Listes de diffusion** liées aux cercles (créer une tension et notifier un groupe de pairs directement par l’envoi d’un e-mail).
  * **Système de vote** pour l’élection des Rôles (tirage au sort, jugement majoritaire, etc).
  * **Trouvez** des pairs et recrutez des collaborateurs dans l’ensemble de Fractale en publiant des rôles ouverts.
  * GraphQL API.
  * Importateurs de données.
  * Application mobile.
  """

