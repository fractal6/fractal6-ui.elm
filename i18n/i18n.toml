# Features

[govTransp]
  en="Governance Transparency"
  fr="Gouvernance Transparente"
  it="Trasparenza della Governance"
  es="Transparencia de la Gobernanza"
[govTranspAbout]
  en="Keep anyone to the same page. Engage your peers by sharing the structure of your organisation, the purposes of your circles and the mandates of your roles. Roles comes with authority rules that allows giving responsabilities and trust to members and autonomy in the governance of circles."
  fr="Faites en sorte que tout le monde soit sur la même longueur d’onde. Engagez vos pairs en partageant la structure de votre organisation, les objectifs de vos cercles et les mandats de vos rôles. Les rôles sont accompagnés de règles d’autorité qui permettent de donner des responsabilités et de la confiance aux membres et de l’autonomie dans la gouvernances des cercles."
  it="Tieni tutti allineati. Coinvolgi i tuoi pari condividendo la struttura della tua organizzazione, gli scopi dei tuoi cerchi e i mandati dei tuoi ruoli. I ruoli sono accompagnati da regole di autorità che permettono di dare responsabilità e fiducia ai membri e autonomia nella governance dei cerchi."
  es="Mantén a todos en la misma página. Involucra a tus compañeros compartiendo la estructura de tu organización, los propósitos de tus círculos y los mandatos de tus roles. Los roles incluyen reglas de autoridad que permiten dar responsabilidades y confianza a los miembros, y autonomía en la gobernanza de los círculos."

