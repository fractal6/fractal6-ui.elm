[tensionTypeHeader]
  en="Select the right category to help finding and solving {{_tension_}}s."
  fr="Sélectionnez la bonne catégorie pour vous aider à trouver et à résoudre les {{_tension_}}s."
  it="Seleziona la categoria giusta per aiutare a trovare e risolvere ogni {{_tension_}}."
  es="Selecciona la categoría adecuada para ayudar a encontrar y resolver cada {{_tension_}}."

[tensionTypeDoc]
  en="""
You can change a {{_tension_}} type to the following categories:

- **Operational**: A general category, it can be task, an issue or whatever that need to be shared or tracked in the organisation.
- **Governance**: Concerning the structure of the organisation, the {{_mandate_}}s etc.
- **Help**: For help requests, questions or clarifications.

Alert and Annoucement {{_tension_}} can only be set when you create a new {{_tension_}}.
"""
  fr="""
Vous pouvez modifier un type de {{_tension_}} dans les catégories suivantes  :

- **Opérationnel** : Une catégorie générale, il peut s'agir d'une tâche, d'un problème ou de tout ce qui doit être partagé ou suivie dans l'organisation.
- **Gouvernance** : Concernant la structure de l'organisation, les {{_mandate_}}s, etc.
- **Aide** : Pour les demandes d'aides, les questions ou les clarifications.

Les {{_tension_}}s d'Alerte et d'Annonce ne peuvent être définies que lorsque vous créez une nouvelle {{_tension_}}.
"""
  it="""
Puoi cambiare il tipo di una {{_tension_}} nelle seguenti categorie:

- **Operativa**: una categoria generale, può essere un’attività, un problema o qualsiasi cosa debba essere condivisa o seguita nell’organizzazione.
- **Governance**: riguarda la struttura dell’organizzazione, ogni {{_mandate_}}, ecc.
- **Aiuto**: per richieste di aiuto, domande o chiarimenti.

Il tipo Allerta o Annuncio di una {{_tension_}} può essere impostato solo quando crei una nuova {{_tension_}}.
"""
  es="""
Puedes cambiar el tipo de una {{_tension_}} a las siguientes categorías:

- **Operativa**: una categoría general, puede ser una tarea, una incidencia o cualquier cosa que deba compartirse o seguirse en la organización.
- **Gobernanza**: relativa a la estructura de la organización, cada {{_mandate_}}, etc.
- **Ayuda**: para solicitudes de ayuda, preguntas o aclaraciones.

El tipo Alerta o Anuncio de una {{_tension_}} solo puede definirse al crear una nueva {{_tension_}}.
"""

