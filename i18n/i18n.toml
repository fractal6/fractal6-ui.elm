[asyncCom]
  en="Asynchronous Communication"
  fr="Communication Asynchrone"
  it="Comunicazione Asincrona"
  es="Comunicación Asíncrona"
[asyncComAbout]
  en="Twitter use tweets, Gmail use e-mails, Fractale use tensions. A tension is a general communication object that is akin to an email and can be sent to any circle in Fractale. Tensions comes with general categories to distinguish the type of problem to deal with, **Operational**, **Governance**, **Help** or **Alert**, along with user-defined labels to help you organize your data. The recipients of the notifications are naturally determined by the members of the targeted circle and the type of tension. Tensions can be searched and filtered based directly on the structure of the organisation."
  fr="Twitter utilise des tweets, Gmail utilise des e-mails, Fractale utilise des tensions. Une tension est un objet de communication général qui s’apparente à un e-mail et qui peut être envoyé à n’importe quel cercle dans Fractale. Les tensions sont fournies avec des catégories générales pour distinguer le type de problème à traiter, **Opérationnel**, **Gouvernance**, **Aide** ou **Alerte**, ainsi que des étiquettes définies par l’utilisateur pour vous aider à organiser vos données. Les destinataires des notifications sont naturellement déterminés par les membres du cercle ciblé et le type de tension. Les tensions peuvent être recherchées et filtrées en se basant directement sur la structure de l’organisation."
  it="Twitter usa i tweet, Gmail usa le email, Fractale usa le tensioni. Una tensione è un oggetto di comunicazione generico, simile a un’email, che può essere inviato a qualsiasi cerchio in Fractale. Le tensioni hanno categorie generali per distinguere il tipo di problema da affrontare, **Operativa**, **Governance**, **Aiuto** o **Allerta**, insieme a etichette definite dall’utente per aiutarti a organizzare i tuoi dati. I destinatari delle notifiche sono determinati naturalmente dai membri del cerchio destinatario e dal tipo di tensione. Le tensioni possono essere cercate e filtrate basandosi direttamente sulla struttura dell’organizzazione."
  es="Twitter usa tuits, Gmail usa correos electrónicos, Fractale usa tensiones. Una tensión es un objeto de comunicación general, similar a un correo electrónico, que puede enviarse a cualquier círculo en Fractale. Las tensiones tienen categorías generales para distinguir el tipo de problema a tratar, **Operativa**, **Gobernanza**, **Ayuda** o **Alerta**, junto con etiquetas definidas por el usuario para ayudarte a organizar tus datos. Los destinatarios de las notificaciones se determinan de forma natural por los miembros del círculo destinatario y el tipo de tensión. Las tensiones se pueden buscar y filtrar basándose directamente en la estructura de la organización."

