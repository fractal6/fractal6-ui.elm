  fr="Rôle par défaut avec une autorisation restreinte."

[coordinatorRoleInfo]
  en="Role with administration rights at the circle level."
  fr="Rôle avec des droits d’administration au niveau du cercle."

[labelDeleteInfoHeader]
  en="Label present in other circles and those used in labeled {{_tension_}}s won't be deleted."
  fr="Les étiquettes présentes dans d'autres cercles et utilisées dans les {{_tension_}}s étiquetées ne seront pas supprimées."

[roleDeleteInfoHeader]
