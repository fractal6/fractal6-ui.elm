  it="""Lo scopo {{}} definisce il cuore della sua missione e i suoi obiettivi.

Questo documento può essere modificato in seguito, man mano che l’organizzazione evolve.
  """
  es="""El propósito {{}} define el núcleo de su misión y sus objetivos.

Este documento puede modificarse más adelante a medida que la organización evoluciona.
  """

[responsabilitiesHelper]
  en="Responsibilities define the ongoing activities, work, and functions that the role or circle is expected to perform. They describe what the role is accountable for on a continuing basis."
  fr="Les responsabilités définissent les activités, travaux et fonctions continus que le rôle ou le cercle est censé accomplir. Elles décrivent ce dont le rôle est responsable de façon permanente."
  it="Le responsabilità definiscono le attività, il lavoro e le funzioni continuative che il ruolo o il cerchio deve svolgere. Descrivono ciò di cui il ruolo è responsabile in modo permanente."
  es="Las responsabilidades definen las actividades, el trabajo y las funciones continuas que se espera que realice el rol o el círculo. Describen aquello de lo que el rol es responsable de forma permanente."

[domainsHelper]
  en="Domains are the properties, resources, processes, or areas that this role or circle has exclusive control over. Others must get permission to impact these domains."
  fr="Les domaines sont les propriétés, ressources, processus ou zones sur lesquels ce rôle ou cercle a un contrôle exclusif. Les autres doivent obtenir une permission pour impacter ces domaines."
  it="I domini sono le proprietà, le risorse, i processi o le aree su cui questo ruolo o cerchio ha il controllo esclusivo. Gli altri devono ottenere un permesso per intervenire su questi domini."
  es="Los dominios son las propiedades, recursos, procesos o áreas sobre los que este rol o círculo tiene control exclusivo. Los demás deben obtener permiso para afectar a estos dominios."

[policiesHelper]
  en="Policies describe the principles and guidelines that govern this role or circle, including how its domains, when there are any, may be accessed or used by others. They express what is expected and why, and are meant to remain stable over time."
  fr="Les politiques décrivent les principes et directives qui gouvernent ce rôle ou cercle, ainsi que la manière dont ses domaines, lorsqu’il en existe, peuvent être accessibles ou utilisés par d’autres. Elles expriment ce qui est attendu et pourquoi, et ont vocation à rester stables dans le temps."
  it="Le politiche descrivono i principi e le linee guida che governano questo ruolo o cerchio, incluso il modo in cui i suoi domini, se presenti, possono essere accessibili o usati da altri. Esprimono cosa ci si aspetta e perché, e sono pensate per restare stabili nel tempo."
  es="Las políticas describen los principios y pautas que rigen este rol o círculo, incluido cómo otros pueden acceder a sus dominios, si los hay, o usarlos. Expresan lo que se espera y por qué, y están pensadas para mantenerse estables en el tiempo."

[rulesHelper]
  en="Rules translate the policies into concrete and applicable conditions: what is allowed, forbidden or required, and in which circumstances. A single policy is usually carried out by several rules, which can be adjusted as often as needed without changing the policy itself."
  fr="Les règles traduisent les politiques en conditions concrètes et applicables : ce qui est autorisé, interdit ou requis, et dans quelles circonstances. Une même politique est généralement mise en œuvre par plusieurs règles, qui peuvent être ajustées aussi souvent que nécessaire sans modifier la politique elle-même."
  it="Le regole traducono le politiche in condizioni concrete e applicabili: cosa è consentito, vietato o richiesto, e in quali circostanze. Una stessa politica è di solito attuata da più regole, che possono essere modificate quanto serve senza cambiare la politica stessa."
  es="Las reglas traducen las políticas en condiciones concretas y aplicables: qué está permitido, prohibido o es obligatorio, y en qué circunstancias. Una misma política suele aplicarse mediante varias reglas, que pueden ajustarse tantas veces como sea necesario sin cambiar la política en sí."



