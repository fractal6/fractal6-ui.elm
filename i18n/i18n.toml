  fr="Les rôles présents dans d’autres cercles et ceux créés dans votre organisation ne seront pas supprimés."

[contractInfoHeader]
  en="A peer validation is needed to complete this action."
  fr="Une validation par les pairs est nécessaire pour compléter cette action."

[contractInfo]
  en="When you do not have the authority to modify a ressource, you can create a contract. It will notify the organisation roles with the authority level able to validate your request. The action will be performed if the contract is accepted."
  fr="Lorsque vous n’avez pas l’autorité nécessaire pour modifier une ressource, vous pouvez créer un contrat. Il notifiera les rôles de l’organisation avec le niveau d’autorité capable de valider votre demande. L’action sera exécutée si le contrat est accepté."

[tensionTypeHeader]
  en="Select the right category to help finding and solving {{_tension_}}s."
  fr="Sélectionnez la bonne catégorie pour vous aider à trouver et à résoudre les {{_tension_}}s."

[tensionTypeDoc]
  en="""
You can change a {{_tension_}} type to the following categories:

- **Operational**: A general category, it can be task, an issue or whatever that need to be shared or tracked in the organisation.
- **Governance**: Concerning the structure of the organisation, the {{_mandate_}}s etc.
- **Help**: For help requests, questions or clarifications.

Alert and Annoucement {{_tension_}} can only be set when you create a new {{_tension_}}.
"""
  fr="""
Vous pouvez modifier un type de {{_tension_}} dans les catégories suivantes  :

- **Opérationnel** : Une catégorie générale, il peut s'agir d'une tâche, d'un problème ou de tout ce qui doit être partagé ou suivie dans l'organisation.
- **Gouvernance** : Concernant la structure de l'organisation, les {{_mandate_}}s, etc.
- **Aide** : Pour les demandes d'aides, les questions ou les clarifications.

Les {{_tension_}}s d'Alerte et d'Annonce ne peuvent être définies que lorsque vous créez une nouvelle {{_tension_}}.
"""

