[authorityHelper]
  en="""A role has an authority that determines the rights of users playing that role.
These rights are circumscribed to the circle in which the role is created.

- **Peer**: Can create and comment on tensions. Propose {{_mandate_}} changes.
- **Coordinator**: All *Pee*r authority + can edit tension type, labels and assignees, edit {{_mandate_}}s, invitate members, and create new roles and sub-circle (limited to the circle to which the role belongs).

See [the documentation](https://doc.fractale.co/circle/#authority) to learn more.
"""
  fr="""Un rôle a une autorité qui détermine les droits des utilisateurs jouant ce rôle.
Ces droits sont circonscrits au cercle dans lequel le rôle est crée.

- **Peer**: Peut créer et commenter des tensions. Proposer des changements de {{_mandate_}}.
- **Coordinator**: Tous les droits des *Peer* + peut modifier le type des tensions, les étiquettes et les assignés, modifier les {{_mandate_}}s, inviter des membres et créer de nouveaux rôles et sous-cercles (limité au cercle auquel le rôle appartient).

Voir [la documentation](https://doc.fractale.co/circle/#authority) pour en savoir plus.
"""
  it="""Un ruolo ha un’autorità che determina i diritti degli utenti che svolgono quel ruolo.
Questi diritti sono circoscritti al cerchio in cui il ruolo è creato.

- **Peer**: può creare e commentare tensioni. Proporre modifiche al {{_mandate_}}.
- **Coordinator**: tutta l’autorità *Peer* + può modificare il tipo, le etichette e gli assegnatari delle tensioni, modificare ogni {{_mandate_}}, invitare membri e creare nuovi ruoli e sotto-cerchi (limitatamente al cerchio a cui appartiene il ruolo).

Vedi [la documentazione](https://doc.fractale.co/circle/#authority) per saperne di più.
"""
  es="""Un rol tiene una autoridad que determina los derechos de los usuarios que desempeñan ese rol.
Estos derechos se limitan al círculo en el que se crea el rol.

- **Peer**: puede crear y comentar tensiones. Proponer cambios en el {{_mandate_}}.
- **Coordinator**: toda la autoridad *Peer* + puede editar el tipo, las etiquetas y los asignados de las tensiones, editar cada {{_mandate_}}, invitar a miembros y crear nuevos roles y subcírculos (limitado al círculo al que pertenece el rol).

Consulta [la documentación](https://doc.fractale.co/circle/#authority) para saber más.
"""

[governanceHelper]
  en="""The governance of a circle determines how the authority of roles is interpreted.

- **Coordinated** : Only roles with *Coordinator* authority have editing rights in their circle.
- **Agile** : All roles in a circle have edit/modification rights, without distinction.

See [the documentation](https://doc.fractale.co/circle/#authority) to learn more.
"""
  fr="""La gouvernance d’un cercle détermine la manière dont l’authorité des rôles est interprété.

- **Coordinated** : Seul les rôles avec l’authorité *Coordinator* ont les droits d’édition dans leurs cercle.
- **Agile** : Tout les rôles d’un cercle ont les droits d’édition/modification, sans distinction.

Voir [la documentation](https://doc.fractale.co/circle/#authority) pour en savoir plus.
"""
  it="""La governance di un cerchio determina come viene interpretata l’autorità dei ruoli.

- **Coordinated** : solo i ruoli con autorità *Coordinator* hanno diritti di modifica nel loro cerchio.
- **Agile** : tutti i ruoli di un cerchio hanno diritti di modifica, senza distinzione.

Vedi [la documentazione](https://doc.fractale.co/circle/#authority) per saperne di più.
"""
  es="""La gobernanza de un círculo determina cómo se interpreta la autoridad de los roles.

- **Coordinated** : solo los roles con autoridad *Coordinator* tienen derechos de edición en su círculo.
- **Agile** : todos los roles de un círculo tienen derechos de edición/modificación, sin distinción.

Consulta [la documentación](https://doc.fractale.co/circle/#authority) para saber más.
"""

[purposeHelper]
  en="""The purpose of {{}} defines the core of its mission and its objectives.

