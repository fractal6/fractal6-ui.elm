[heroSubtitle]
  en="""Design your organisation,
      Invite your collaborators,
      Identify and collect [tensions](https://doc.fractale.co/tension/ "Tasks, issues, Q&A, announcements, etc "),
      Share, discuss and solve them,
      Evolve organically."""
  fr="""Dessinez votre organisation,
        Invitez vos collaborateurs,
        Identifiez et collectez les [tensions](https://doc.fractale.co/tension/ "Tâches, tickets, Q&A, annonces, etc"),
        Partagez, échangez et résolvez-les,
        Evoluez organiquement."""
  it="""Progetta la tua organizzazione,
      Invita i tuoi collaboratori,
      Identifica e raccogli le [tensioni](https://doc.fractale.co/tension/ "Attività, ticket, domande e risposte, annunci, ecc."),
      Condividile, discutile e risolvile,
      Evolvi in modo organico."""
  es="""Diseña tu organización,
      Invita a tus colaboradores,
      Identifica y recoge las [tensiones](https://doc.fractale.co/tension/ "Tareas, incidencias, preguntas y respuestas, anuncios, etc."),
      Compártelas, debátelas y resuélvelas,
      Evoluciona de forma orgánica."""


[aboutHero]
  en="**Fractale** is a collaboration and communication platform inspired by self-organized systems and open-source culture. We build collective intelligence tools to foster transparency, scalability and resilience in organisations."
  fr="**Fractale** est une plateforme de collaboration et de communication inspirée par les systèmes auto-organisés et la culture open source. Nous construisons des outils d’intelligence collective qui favorisent la transparence, accompagne l’évolution et renforce la résilience des organisations."
  it="**Fractale** è una piattaforma di collaborazione e comunicazione ispirata ai sistemi auto-organizzati e alla cultura open source. Sviluppiamo strumenti di intelligenza collettiva per favorire la trasparenza, la scalabilità e la resilienza delle organizzazioni."
  es="**Fractale** es una plataforma de colaboración y comunicación inspirada en los sistemas autoorganizados y la cultura de código abierto. Creamos herramientas de inteligencia colectiva para fomentar la transparencia, la escalabilidad y la resiliencia de las organizaciones."

[npoHero]
  en="From a few members to several thousand collaborators, Fractale allows NPOs to facilitate team coordination, make governance structures transparent while providing a memory to the organisation."
  fr="De quelques membres à plusieurs milliers de collaborateurs, Fractale permet aux NPOs (Non-Profit Organisation) de faciliter la coordination d’équipes, rendre transparentes les structures de gouvernance et fluidifier l’information tout en fournissant une mémoire à l’organisation."
  it="Da pochi membri a diverse migliaia di collaboratori, Fractale permette alle organizzazioni non profit di facilitare il coordinamento dei team e rendere trasparenti le strutture di governance, offrendo al contempo una memoria all’organizzazione."
  es="Desde unos pocos miembros hasta varios miles de colaboradores, Fractale permite a las organizaciones sin ánimo de lucro facilitar la coordinación de equipos y hacer transparentes las estructuras de gobernanza, a la vez que proporciona una memoria a la organización."

[corpHero]
  en="From _**Agile**_ methods to _**Holacracy**_, Fractale allows you to implement management and project tracking methods, in an easy and intuitive way. Boost the engagement of your teams around clear objectives while making your communication more fluid."
  fr="Des méthodes _**Agiles**_ à l’_**Holacratie**_, Fractale vous permet de mettre en œuvre un management et du suivi de projets, de manière simple et intuitive. Favorisez l’implication de vos équipes autour d’objectifs clairs tout en fluidifiant votre communication."
  it="Dai metodi _**Agile**_ all’_**Olacrazia**_, Fractale ti permette di applicare metodi di gestione e monitoraggio dei progetti in modo semplice e intuitivo. Aumenta il coinvolgimento dei tuoi team attorno a obiettivi chiari rendendo la comunicazione più fluida."
  es="Desde los métodos _**Agile**_ hasta la _**Holacracia**_, Fractale te permite aplicar métodos de gestión y seguimiento de proyectos de forma sencilla e intuitiva. Impulsa el compromiso de tus equipos en torno a objetivos claros mientras haces más fluida tu comunicación."

