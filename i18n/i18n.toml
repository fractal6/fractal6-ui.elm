  en="""You are about to add a new owner.

This action is irreversible. Once added, an owner can only be removed if they choose to leave the role themselves.

Additionally, an owner has the highest level of read and write access within the organisation.

Please confirm to continue.
"""
  fr="""Vous êtes sur le point d’ajouter **un nouveau propriétaire**.

Cette action est irréversible. Une fois ajouté, un propriétaire ne peut être retiré que s’il décide de quitter ce rôle lui-même.

De plus, un propriétaire dispose du niveau de droit et d’accès en lecture et écriture le plus élevé dans l’organisation.

Veuillez confirmer pour continuer.
"""
  it="""Stai per aggiungere un nuovo proprietario.

Questa azione è irreversibile. Una volta aggiunto, un proprietario può essere rimosso solo se decide di lasciare il ruolo di sua iniziativa.

Inoltre, un proprietario ha il livello più alto di accesso in lettura e scrittura nell’organizzazione.

Conferma per continuare.
"""
  es="""Estás a punto de añadir un nuevo propietario.

Esta acción es irreversible. Una vez añadido, un propietario solo puede ser eliminado si decide abandonar el rol por sí mismo.

Además, un propietario tiene el nivel más alto de acceso de lectura y escritura en la organización.

Confirma para continuar.
"""

