[contractInfo]
  en="When you do not have the authority to modify a ressource, you can create a contract. It will notify the organisation roles with the authority level able to validate your request. The action will be performed if the contract is accepted."
  fr="Lorsque vous n’avez pas l’autorité nécessaire pour modifier une ressource, vous pouvez créer un contrat. Il notifiera les rôles de l’organisation avec le niveau d’autorité capable de valider votre demande. L’action sera exécutée si le contrat est accepté."
  it="Quando non hai l’autorità per modificare una risorsa, puoi creare un contratto. Verranno notificati i ruoli dell’organizzazione con il livello di autorità in grado di convalidare la tua richiesta. L’azione verrà eseguita se il contratto viene accettato."
