[circleAuthorityDoc]
  en="""
- Create and edit roles and circles
- Edit {{_tension_}}s (title, status (Open/Close), assignees, etc)
- Edit {{_mandate_}}s
- invite new members

Note: To edit {{_mandate_}}s you need to publish the modifications done in the corresponding (governance) {{_tension_}}.
"""
  fr="""
- Créer et modifier les rôles et les cercles
- Editer les {{_tension_}}s (titre, statut (Ouvert/Fermé), attributaires, etc.)
- Modifier les {{_mandate_}}s
- Inviter de nouveaux membres

Note : Pour éditer des {{_mandate_}}s, vous devez publier les modifications effectuées dans la {{_tension_}} (gouvernance) correspondante.
"""
  it="""
- Creare e modificare ruoli e cerchi
- Modificare ogni {{_tension_}} (titolo, stato (Aperta/Chiusa), assegnatari, ecc.)
- Modificare ogni {{_mandate_}}
- Invitare nuovi membri

Nota: per modificare un {{_mandate_}} devi pubblicare le modifiche fatte nella {{_tension_}} (di governance) corrispondente.
"""
  es="""
- Crear y editar roles y círculos
- Editar cada {{_tension_}} (título, estado (Abierta/Cerrada), asignados, etc.)
- Editar cada {{_mandate_}}
- Invitar a nuevos miembros

Nota: para editar un {{_mandate_}} debes publicar las modificaciones hechas en la {{_tension_}} (de gobernanza) correspondiente.
"""

[labelsInfoHeader]
  en="Creating new labels helps you sort out your {{_tension_}}s"
  fr="La création de nouvelles étiquettes vous aide à trier vos {{_tension_}}s."
  it="Creare nuove etichette ti aiuta a ordinare ogni {{_tension_}}"
  es="Crear nuevas etiquetas te ayuda a ordenar cada {{_tension_}}"

[labelsInfoDoc]
  en="""
When you create labels here, you can then attach them to your {{_tension_}}s. You will also be able to filter {{_tension_}}s according to labels.

**Scope**: The labels that you can attach to a {{_tension_}} are those who are present in either its receicer circle or in any of the parents of the receiver circle.
"""
  fr="""
Lorsque vous créez des étiquettes ici, vous pouvez ensuite les attacher à vos {{_tension_}}s. Vous pourrez également filtrer les {{_tension_}}s en fonction des étiquettes.

**Portée** : Les étiquettes que vous pouvez attacher à une {{_tension_}} sont celles qui sont présentes soit dans son cercle récepteur, soit dans l'un des parents du cercle récepteur.
"""
  it="""
Quando crei delle etichette qui, puoi poi associarle a ogni {{_tension_}}. Potrai anche filtrare ogni {{_tension_}} in base alle etichette.

**Ambito**: le etichette che puoi associare a una {{_tension_}} sono quelle presenti nel suo cerchio destinatario o in uno qualsiasi dei cerchi genitori del cerchio destinatario.
"""
  es="""
Cuando creas etiquetas aquí, puedes asociarlas a cada {{_tension_}}. También podrás filtrar cada {{_tension_}} según sus etiquetas.

**Ámbito**: las etiquetas que puedes asociar a una {{_tension_}} son las que están presentes en su círculo destinatario o en cualquiera de los círculos padres del círculo destinatario.
"""

[rolesInfoHeader]
  en="Creating new roles template help you to manage your organisation"
  fr="La création de nouveaux modèles de rôles vous aide à gérer votre organisation"
  it="Creare nuovi modelli di ruolo ti aiuta a gestire la tua organizzazione"
  es="Crear nuevas plantillas de rol te ayuda a gestionar tu organización"

[rolesInfoDoc]
  en="""
When you create a role here, you can use it as a template when you add a new role in your organisation.

**Scope**: The roles template that you can use when creating a new role are those who are present in any of its parents circles.
"""
  fr="""
Lorsque vous créez un rôle ici, vous pouvez l’utiliser comme modèle lorsque vous ajoutez un nouveau rôle dans votre organisation.

**Portée** : Le modèle de rôles que vous pouvez utiliser lorsque vous créez un nouveau rôle sont ceux qui sont présents dans l’un de ses cercles parents.
"""
  it="""
Quando crei un ruolo qui, puoi usarlo come modello quando aggiungi un nuovo ruolo nella tua organizzazione.

**Ambito**: i modelli di ruolo che puoi usare quando crei un nuovo ruolo sono quelli presenti in uno qualsiasi dei suoi cerchi genitori.
"""
  es="""
Cuando creas un rol aquí, puedes usarlo como plantilla al añadir un nuevo rol en tu organización.

**Ámbito**: las plantillas de rol que puedes usar al crear un nuevo rol son las que están presentes en cualquiera de sus círculos padres.
"""

